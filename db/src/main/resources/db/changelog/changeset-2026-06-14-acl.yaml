databaseChangeLog:
  - changeSet:
      id: 2026-06-14-01
      author: codex
      comment: extend-roles-with-code-and-system-role
      changes:
        - sql:
            splitStatements: false
            stripComments: true
            sql: |
              ALTER TABLE builders.roles
              ADD COLUMN IF NOT EXISTS code VARCHAR(64);

              ALTER TABLE builders.roles
              ADD COLUMN IF NOT EXISTS description TEXT;

              ALTER TABLE builders.roles
              ADD COLUMN IF NOT EXISTS system_role BOOLEAN NOT NULL DEFAULT false;

              UPDATE builders.roles
              SET code = CASE
                    WHEN name = 'ROLE_SUPER_ADMIN' THEN 'SUPER_ADMIN'
                    WHEN name = 'ROLE_ADMIN' THEN 'ADMIN'
                    WHEN name = 'ROLE_BUILDER' THEN 'BUILDER'
                    WHEN name = 'ROLE_MINER' THEN 'MINER'
                    WHEN name = 'ROLE_COORDINATOR' THEN 'COORDINATOR'
                    WHEN name = 'ROLE_MANAGER' THEN 'MANAGER'
                    WHEN name = 'ROLE_CEO' THEN 'CEO'
                    WHEN name = 'ROLE_VIEWER' THEN 'VIEWER'
                    WHEN name = 'ROLE_USER' THEN 'USER'
                    ELSE regexp_replace(name, '^ROLE_', '')
                END,
                  name = CASE
                    WHEN name = 'ROLE_SUPER_ADMIN' THEN 'Super Administrator'
                    WHEN name = 'ROLE_ADMIN' THEN 'Administrator'
                    WHEN name = 'ROLE_BUILDER' THEN 'Builder'
                    WHEN name = 'ROLE_MINER' THEN 'Miner'
                    WHEN name = 'ROLE_COORDINATOR' THEN 'Coordinator'
                    WHEN name = 'ROLE_MANAGER' THEN 'Manager'
                    WHEN name = 'ROLE_CEO' THEN 'CEO'
                    WHEN name = 'ROLE_VIEWER' THEN 'Viewer'
                    WHEN name = 'ROLE_USER' THEN 'User'
                    ELSE COALESCE(name, 'Role')
                END,
                  description = CASE
                    WHEN name = 'ROLE_SUPER_ADMIN' THEN 'Full access bypass role'
                    WHEN name = 'ROLE_ADMIN' THEN 'Administrative role'
                    WHEN name = 'ROLE_BUILDER' THEN 'Construction and production role'
                    WHEN name = 'ROLE_MINER' THEN 'Mining and extraction role'
                    WHEN name = 'ROLE_COORDINATOR' THEN 'Coordination role'
                    WHEN name = 'ROLE_MANAGER' THEN 'Management role'
                    WHEN name = 'ROLE_CEO' THEN 'Executive role'
                    WHEN name = 'ROLE_VIEWER' THEN 'Read-only legacy role'
                    WHEN name = 'ROLE_USER' THEN 'Legacy general user role'
                    ELSE COALESCE(description, 'Migrated system role')
                END,
                  system_role = true
              WHERE code IS NULL;

              INSERT INTO builders.roles (code, name, description, system_role)
              SELECT seed.code, seed.name, seed.description, seed.system_role
              FROM (
                VALUES
                  ('SUPER_ADMIN', 'Super Administrator', 'Full access bypass role', true),
                  ('ADMIN', 'Administrator', 'Administrative role', true),
                  ('BUILDER', 'Builder', 'Construction and production role', true),
                  ('MINER', 'Miner', 'Mining and extraction role', true),
                  ('COORDINATOR', 'Coordinator', 'Coordination role', true),
                  ('MANAGER', 'Manager', 'Management role', true),
                  ('CEO', 'CEO', 'Executive role', true),
                  ('VIEWER', 'Viewer', 'Read-only legacy role', true),
                  ('USER', 'User', 'Legacy general user role', true)
              ) AS seed(code, name, description, system_role)
              WHERE NOT EXISTS (
                SELECT 1 FROM builders.roles r WHERE r.code = seed.code
              );

              ALTER TABLE builders.roles
              ALTER COLUMN code SET NOT NULL;

              ALTER TABLE builders.roles
              ALTER COLUMN name SET NOT NULL;

              ALTER TABLE builders.roles
              ADD CONSTRAINT uq_roles_code UNIQUE (code);

