  - changeSet:
      id: 2026-06-14-06
      author: codex
      comment: seed-default-roles-and-default-role-permissions
      changes:
        - sql:
            splitStatements: false
            stripComments: true
            sql: |
              INSERT INTO builders.roles (code, name, description, system_role)
              VALUES
                ('SUPER_ADMIN', 'Super Administrator', 'Full access bypass role', true),
                ('ADMIN', 'Administrator', 'Administrative role', true),
                ('CEO', 'CEO', 'Executive role', false),
                ('MANAGER', 'Manager', 'Management role', false),
                ('WORKER', 'Worker', 'General operational role', false),
                ('MINER', 'Miner', 'Mining and extraction role', false),
                ('BUILDER', 'Builder', 'Construction and production role', false)
              ON CONFLICT (code) DO UPDATE
              SET name = EXCLUDED.name,
                  description = EXCLUDED.description,
                  system_role = EXCLUDED.system_role;

              UPDATE builders.roles
              SET system_role = CASE
                    WHEN code IN ('SUPER_ADMIN', 'ADMIN') THEN true
                    ELSE false
                END
              WHERE code IN ('SUPER_ADMIN', 'ADMIN', 'CEO', 'MANAGER', 'WORKER', 'MINER', 'BUILDER');

              INSERT INTO builders.role_permissions (role_id, permission_id)
              SELECT r.id, p.id
              FROM builders.roles r
              CROSS JOIN builders.permissions p
              WHERE r.code = 'ADMIN'
              ON CONFLICT DO NOTHING;

              WITH role_perm(role_code, perm_code) AS (
                VALUES
                  ('CEO', 'DASHBOARD_VIEW'),
                  ('CEO', 'CORPORATION_VIEW'),
                  ('CEO', 'CORPORATION_EDIT'),
                  ('CEO', 'MEMBERS_VIEW'),
                  ('CEO', 'MEMBERS_MANAGE'),
                  ('CEO', 'CONTRACTS_VIEW'),
                  ('CEO', 'WALLET_VIEW'),

                  ('MANAGER', 'DASHBOARD_VIEW'),
                  ('MANAGER', 'MEMBERS_VIEW'),
                  ('MANAGER', 'MEMBERS_MANAGE'),
                  ('MANAGER', 'CONTRACTS_VIEW'),
                  ('MANAGER', 'CONTRACTS_CREATE'),
                  ('MANAGER', 'CONTRACTS_EDIT'),
                  ('MANAGER', 'MINING_OPS_VIEW'),
                  ('MANAGER', 'MINING_OPS_CREATE'),
                  ('MANAGER', 'BUILDS_VIEW'),

                  ('WORKER', 'DASHBOARD_VIEW'),
                  ('WORKER', 'CONTRACTS_VIEW'),
                  ('WORKER', 'MINING_OPS_VIEW'),
                  ('WORKER', 'BUILDS_VIEW'),

                  ('MINER', 'DASHBOARD_VIEW'),
                  ('MINER', 'MINING_OPS_VIEW'),
                  ('MINER', 'MINING_OPS_CREATE'),

                  ('BUILDER', 'DASHBOARD_VIEW'),
                  ('BUILDER', 'BUILDS_VIEW'),
                  ('BUILDER', 'BUILDS_CREATE'),
                  ('BUILDER', 'BUILDS_EDIT')
              )
              INSERT INTO builders.role_permissions (role_id, permission_id)
              SELECT r.id, p.id
              FROM role_perm rp
              JOIN builders.roles r ON r.code = rp.role_code
              JOIN builders.permissions p ON p.code = rp.perm_code
              ON CONFLICT DO NOTHING;
