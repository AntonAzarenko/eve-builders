                  ('USERS_EDIT', 'Edit users', 'Edit existing users', 'USERS'),
                  ('USERS_DELETE', 'Delete users', 'Delete users', 'USERS'),
                  ('ROLES_VIEW', 'View roles', 'See available roles', 'ROLES'),
                  ('ROLES_CREATE', 'Create roles', 'Create new roles', 'ROLES'),
                  ('ROLES_EDIT', 'Edit roles', 'Edit existing roles', 'ROLES'),
                  ('ROLES_DELETE', 'Delete roles', 'Delete roles', 'ROLES'),
                  ('ROLES_ASSIGN', 'Assign roles', 'Assign roles to users', 'ROLES'),
                  ('PERMISSIONS_VIEW', 'View permissions', 'See permission catalog', 'PERMISSIONS'),
                  ('PERMISSIONS_ASSIGN', 'Assign permissions', 'Assign permissions to roles or users', 'PERMISSIONS'),
                  ('CORPORATION_VIEW', 'View corporation', 'Read corporation data', 'CORPORATION'),
                  ('CORPORATION_EDIT', 'Edit corporation', 'Edit corporation data', 'CORPORATION'),
                  ('MEMBERS_VIEW', 'View members', 'Read member data', 'MEMBERS'),
                  ('MEMBERS_MANAGE', 'Manage members', 'Manage member data', 'MEMBERS'),
                  ('CONTRACTS_VIEW', 'View contracts', 'Read contract data', 'CONTRACTS'),
                  ('CONTRACTS_CREATE', 'Create contracts', 'Create contracts', 'CONTRACTS'),
                  ('CONTRACTS_EDIT', 'Edit contracts', 'Edit contracts', 'CONTRACTS'),
                  ('CONTRACTS_DELETE', 'Delete contracts', 'Delete contracts', 'CONTRACTS'),
                  ('MINING_OPS_VIEW', 'View mining ops', 'Read mining operations', 'MINING_OPS'),
                  ('MINING_OPS_CREATE', 'Create mining ops', 'Create mining operations', 'MINING_OPS'),
                  ('MINING_OPS_EDIT', 'Edit mining ops', 'Edit mining operations', 'MINING_OPS'),
                  ('MINING_OPS_DELETE', 'Delete mining ops', 'Delete mining operations', 'MINING_OPS'),
                  ('BUILDS_VIEW', 'View builds', 'Read builds and production plans', 'BUILDS'),
                  ('BUILDS_CREATE', 'Create builds', 'Create builds and production plans', 'BUILDS'),
                  ('BUILDS_EDIT', 'Edit builds', 'Edit builds and production plans', 'BUILDS'),
                  ('BUILDS_DELETE', 'Delete builds', 'Delete builds and production plans', 'BUILDS'),
                  ('WALLET_VIEW', 'View wallet', 'Read wallet balances', 'WALLET'),
                  ('WALLET_MANAGE', 'Manage wallet', 'Manage wallet operations', 'WALLET')
