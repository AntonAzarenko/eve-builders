  - changeSet:
      id: 2026-06-14-03
      author: codex
      comment: create-user-roles-and-backfill-from-legacy-user-info-roles
      changes:
        - addForeignKeyConstraint:
            baseTableSchemaName: builders
            baseTableName: user_roles
            baseColumnNames: user_id
            referencedTableSchemaName: builders
            referencedTableName: user_info
            referencedColumnNames: uid
            constraintName: fk_user_roles_user
            onDelete: CASCADE
            onUpdate: CASCADE
        - addForeignKeyConstraint:
            baseTableSchemaName: builders
            baseTableName: user_roles
            baseColumnNames: role_id
            referencedTableSchemaName: builders
            referencedTableName: roles
            referencedColumnNames: id
            constraintName: fk_user_roles_role
            onDelete: CASCADE
            onUpdate: CASCADE
        - createIndex:
            schemaName: builders
            tableName: user_roles
            indexName: idx_user_roles_user_id
            columns:
              - column:
                  name: user_id
        - createIndex:
            schemaName: builders
            tableName: user_roles
            indexName: idx_user_roles_role_id
            columns:
              - column:
                  name: role_id
        - sql:
            splitStatements: false
            stripComments: true
            sql: |
              INSERT INTO builders.user_roles (user_id, role_id)
              SELECT DISTINCT ui.uid, r.id
              FROM builders.user_info ui
              CROSS JOIN LATERAL unnest(COALESCE(ui.roles, ARRAY[]::text[])) AS legacy(role_code)
              JOIN builders.roles r
                ON r.code = CASE
                      WHEN legacy.role_code LIKE 'ROLE_%' THEN replace(legacy.role_code, 'ROLE_', '')
                      ELSE upper(legacy.role_code)
                    END
              WHERE NOT EXISTS (
                SELECT 1
                FROM builders.user_roles ur
                WHERE ur.user_id = ui.uid
                  AND ur.role_id = r.id
              );

