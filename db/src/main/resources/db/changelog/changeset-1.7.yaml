databaseChangeLog:
  - changeSet:
      id: replace-role-user-with-builder
      author: anton
      changes:
        - sql:
            splitStatements: false
            stripComments: true
            sql: |
              UPDATE builders.user_info
              SET roles = array_replace(roles, 'ROLE_USER', 'ROLE_BUILDER')
              WHERE 'ROLE_USER' = ANY(roles);

  - changeSet:
      id: add-fk-casino-box-reward
      author: anton
      changes:
        - addForeignKeyConstraint:
            baseTableSchemaName: builders
            baseTableName: casino_box
            baseColumnNames: reward_id
            constraintName: fk_casino_box_reward
            referencedTableSchemaName: builders
            referencedTableName: casino_reward
            referencedColumnNames: uid
            onDelete: CASCADE
            onUpdate: CASCADE
