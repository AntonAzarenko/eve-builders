databaseChangeLog:
  - changeSet:
      id: 2026-05-05-01-order-preset-defaults
      author: codex
      changes:
        - addUniqueConstraint:
            schemaName: builders
            tableName: order_preset_defaults
            columnNames: owner_username
            constraintName: uq_order_preset_defaults_owner_username
        - createIndex:
            schemaName: builders
            tableName: order_preset_defaults
            indexName: idx_order_preset_defaults_owner_username
            columns:
              - column:
                  name: owner_username
        - addForeignKeyConstraint:
            baseTableSchemaName: builders
            baseTableName: order_preset_defaults_history
            baseColumnNames: preset_id
            constraintName: fk_order_preset_defaults_history_preset_id
            referencedTableSchemaName: builders
            referencedTableName: order_preset_defaults
            referencedColumnNames: id
        - createIndex:
            schemaName: builders
            tableName: order_preset_defaults_history
            indexName: idx_order_preset_defaults_history_preset_id
            columns:
              - column:
                  name: preset_id
        - createIndex:
            schemaName: builders
            tableName: order_preset_defaults_history
            indexName: idx_order_preset_defaults_history_owner_username
            columns:
              - column:
                  name: owner_username
        - createIndex:
            schemaName: builders
            tableName: order_preset_defaults_history
            indexName: idx_order_preset_defaults_history_changed_date
            columns:
              - column:
                  name: changed_date
