app:
  version: "@app.version@"
  sqlite:
    path: ${APP_SQLLITE_PATH}
  notifications:
    provider: ${APP.NOTIFICATIONS.PROVIDER:telegram}
    telegram:
      enabled: ${APP.NOTIFICATIONS.TELEGRAM.ENABLED:true}
    discord:
      enabled: ${APP.NOTIFICATIONS.DISCORD.ENABLED:false}
  telegram_bot:
    token: ${APP.TELEGRAM_BOT.TOKEN}
  telegram_chat_id: ${APP.TELEGRAM_CHAT_ID}
  telegram_thread_ping_id: ${APP.TELEGRAM_THREAD_PING_ID}
  telegram_thread_request_id: ${APP.TELEGRAM_THREAD_REQUEST_ID}
  discord:
    wait_response: ${APP.DISCORD.WAIT_RESPONSE:false}
    webhook:
      order_url: ${APP.DISCORD.WEBHOOK.ORDER.URL:}
      request_url: ${APP.DISCORD.WEBHOOK.REQUEST.URL:}
    thread:
      order_id: ${APP.DISCORD.THREAD.ORDER.ID:}
      request_id: ${APP.DISCORD.THREAD.REQUEST.ID:}

  jwt:
    issuer: "angular-app"
    secret: ${JWT_SECRET}
    access-ttl-seconds: 900
    refresh-ttl-seconds: 1209600
    refresh-cookie-name: "refresh_token"
  eve:
    corporation:
      id: ${EVE.CORPORATION.ID}
spring:
  application:
    name: eve-builders
  datasource:
    postgresql:
      url: ${SPRING.DATASOURCE.POSTGRESQL.URL}
      driver-class-name: ${SPRING.DATASOURCE.POSTGRESQL.DRIVER-CLASS-NAME}
      username: ${SPRING.DATASOURCE.POSTGRESQL.USERNAME}
      password: ${SPRING.DATASOURCE.POSTGRESQL.PASSWORD}
    sqlite:
      url: ${SPRING.DATASOURCE.SQLITE.URL}
      driver-class-name: ${SPRING.DATASOURCE.SQLITE.DRIVER-CLASS-NAME}
    mariadb:
      url: ${SPRING.DATASOURCE.MARIADB.URL}
      username: ${SPRING.DATASOURCE.MARIADB.USERNAME}
      password: ${SPRING.DATASOURCE.MARIADB.PASSWORD}
      driver-class-name: ${SPRING.DATASOURCE.MARIADB.DRIVER-CLASS-NAME}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        transaction:
          coordinator_class: jdbc
        dialect: org.hibernate.dialect.PostgreSQLDialect
        hbm2ddl:
          auto: update
        jdbc:
          lob:
            non_contextual_creation: true
        boot:
          allow_jdbc_metadata_access: false
  liquibase:
    url: ${SPRING.LIQUIBASE.URL}
    user: ${SPRING.LIQUIBASE.USER}
    password: ${SPRING.LIQUIBASE.PASSWORD}
    change-log: ${SPRING.LIQUIBASE.CHANGE-LOG}
    enabled: ${SPRING.LIQUIBASE.ENABLED}
    driver-class-name: ${SPRING.LIQUIBASE.DRIVER-CLASS-NAME}
  defer-datasource-initialization: false
  main:
    allow-circular-references: true
    allow-bean-definition-overriding: true
  messages:
    encoding: UTF-8
  security:
    oauth2:
      client:
        registration:
          eveonline:
            client-id: ${EVE.CLIENTID}
            client-secret: ${EVE.CLIENTSECRET}
            scope:
              - publicData
              - esi-characters.read_contacts.v1
              - esi-assets.read_assets.v1
              - esi-mail.send_mail.v1
              - esi-contracts.read_corporation_contracts.v1
              - esi-contracts.read_character_contracts.v1
            authorization-grant-type: authorization_code
            redirect-uri: ${eve.redirectUri}
            client-name: EVE Online
        provider:
          eveonline:
            authorization-uri: ${eve.authorize.uri}
            token-uri: ${eve.token.uri}
            user-info-uri: ${eve.user-info.uri}
            user-name-attribute: CharacterName

springdoc:
  api-docs:
    path: /api/v3/api-docs
  swagger-ui:
    path: /api/swagger-ui/index.html
  packages-to-scan: com.azarenka.evebuilders.rest

server:
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
    session:
      timeout: 30m
  tomcat:
    uri-encoding: UTF-8

eve:
  authorize:
    uri: https://login.eveonline.com/v2/oauth/authorize
  character:
    portrait:
      url: https://images.evetech.net/characters/%s/portrait
    assets:
      url: /v5/characters/{characterId}/assets
    contracts:
      url: /v1/characters/{character_id}/contracts
      items:
        url: /v1/characters/{character_id}/contracts/{contract_id}/items
    uri: https://esi.evetech.net/latest/characters/%s
  clientId: ${EVE.CLIENTID}
  clientSecret: ${EVE.CLIENTSECRET}
  frontendСlientSecret: ${EVE.FRONTEND.CLIENTSECRET}
  corporation:
    info: /v5/corporations/{corporation_id}
    contracts:
      url: /v1/corporations/{corporation_id}/contracts
      items:
        url: /v1/corporations/{corporation_id}/contracts/{contract_id}/items
  alliance:
    info: /v3/alliances/{alliance_id}
  mail:
    send:
      url: /latest/characters/{characterId}/mail
  redirectUri: ${EVE.REDIRECTURI}
  frontendRedirectUri: ${EVE.FRONTEND_REDIRECTURI}
  frontendClientId: ${EVE.FRONTENDCLIENTID}
  token:
    uri: https://login.eveonline.com/v2/oauth/token
  user-info:
    uri: https://login.eveonline.com/oauth/verify
  webclient:
    baseUrl: https://esi.evetech.net
  fleet:
    members: /fleets/{fleet_id}/members

timrod:
  api:
    url: https://service.scan-stakan.com/api/auth/checkUserByGroup.php
    token: ${TIMROD_API_TOKEN}
    group-id: ${TIMROD_API_GROUP_ID}

vaadin:
  loading-indicator:
    first-delay: 900
    second-delay: -1
    third-delay: -1

casino:
  api-token: ${CASINO_API_TOKEN}
  start_fleet_info_date: 2025-09-01T00:00:00
